# metamux tmux integration -- session navigation and the picker binds.
#
# Sourced by ~/.tmux.conf via a source-file line that scripts/install-shell.sh
# writes. Edit this file and reload with prefix + r; no reinstall needed.
#
# The Left bind's popup runs `zsh -ic _tmux_pick`, which is defined in the
# sibling shell/metamux.zsh. Keep that file's source line in ~/.zshrc
# unconditional for interactive shells or this bind breaks.
#
# Theming (prefix, copy-mode, clipboard, titles, TPM, catppuccin, status bar)
# stays in ~/.tmux.conf. Only mux navigation lives here.

# No update-environment for CMUX_WORKSPACE_ID. It used to be set here so a pane
# would carry a workspace id, but update-environment writes the ATTACHING
# client's value into the SESSION, and panes snapshot that when they are
# created. Re-attaching a session from another cmux window left panes carrying
# a different workspace's id: five live sessions ended up sharing one, so links
# opened in a stranger's group -- the very symptom this line was added to
# prevent. Identity now comes from the tmux session itself (@metamux_id, asked
# for at call time), which cannot go stale.

# Touch-only switching (Termius accessory F-keys, no prefix).
# Root-table binds: tmux intercepts these BEFORE the foreground app, so they
# work even while Claude owns the pane. One strip tap each.
bind -n F1 previous-window   # prev window
bind -n F2 next-window       # next window
bind -n F3 choose-tree -Zs   # session picker: arrows + Enter (all on the strip)

# Phone-only arrow session hopping. The hijack must fire only for REMOTE
# clients (phone via ssh/mosh), not local ones. client_termname no longer
# discriminates — cmux's embedded Ghostty reports xterm-256color, same as
# Termius. Instead: a LOCAL cmux client carries CMUX_WORKSPACE_ID in its env;
# an ssh/mosh client does not. So Left opens the fzf picker popup only when
# jumpnav is on AND the pressing client is NOT a local cmux client. Inside the
# popup Right opens the highlighted session, Left closes it. F4 toggles jumpnav
# off for normal text-cursor arrows on the phone.
set -g @jumpnav 1
bind -n F4 if -F '#{@jumpnav}' \
  'set -g @jumpnav 0 ; display "arrows: normal"' \
  'set -g @jumpnav 1 ; display "arrows: jump"'
bind -n Left if-shell '[ "#{@jumpnav}" = 1 ] && ! ps eww -p #{client_pid} 2>/dev/null | grep -q CMUX_WORKSPACE_ID' \
  'display-popup -E -w 95% -h 85% "TMUX_PICKER_ARROWS=1 zsh -ic _tmux_pick"' \
  'send-keys Left'
